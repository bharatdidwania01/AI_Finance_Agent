<title>BharatWealth Nexus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: personal side is a single centred column (phone-first); advisor side is a left rail + work area.
   Tokens: neutrals lean green toward the accent; chart series and status colours are separate token sets. */
:root{
  --bg:#f3f5f2; --card:#ffffff; --sunk:#eef2ef; --ink:#18221f; --mute:#5d6a65; --line:#dde3df;
  --rail:#0f3b33; --rail-ink:#e8efe9; --rail-mute:#a9c1b8; --rail-line:#2c5a50;
  --accent:#0f6b5a; --accent-ink:#ffffff; --accent-soft:#e3f0ec; --brass:#9a7020;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --good:#0a7d0a; --warn:#a26400; --bad:#c53030; --na:#6b7471;
  --good-bg:#e6f4e6; --warn-bg:#fbf0dc; --bad-bg:#fbe6e6; --na-bg:#eceeed;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-head:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101614; --card:#18201d; --sunk:#131a17; --ink:#e7ece9; --mute:#9aa8a2; --line:#2a3531;
  --rail:#0a1f1b; --rail-ink:#e8efe9; --rail-mute:#8fa9a0; --rail-line:#21423a;
  --accent:#3fb59b; --accent-ink:#06201a; --accent-soft:#16302a; --brass:#d6a64a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9a2f;
  --good:#5cc489; --warn:#f0b54a; --bad:#f08a80; --na:#9aa3a0;
  --good-bg:#15301f; --warn-bg:#33270f; --bad-bg:#3a1a1a; --na-bg:#242b29;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --card:#18201d; --sunk:#131a17; --ink:#e7ece9; --mute:#9aa8a2; --line:#2a3531;
  --rail:#0a1f1b; --rail-ink:#e8efe9; --rail-mute:#8fa9a0; --rail-line:#21423a;
  --accent:#3fb59b; --accent-ink:#06201a; --accent-soft:#16302a; --brass:#d6a64a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9a2f;
  --good:#5cc489; --warn:#f0b54a; --bad:#f08a80; --na:#9aa3a0;
  --good-bg:#15301f; --warn-bg:#33270f; --bad-bg:#3a1a1a; --na-bg:#242b29;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.55 var(--font-body);background:var(--bg);color:var(--ink)}
.boot{padding:40px 16px;color:var(--mute);text-align:center}
h1,h2,h3{font-family:var(--font-head);text-wrap:balance;margin:0}
h1{font-size:clamp(24px,4vw,32px);font-weight:600;line-height:1.2}
h2{font-size:21px;font-weight:600;line-height:1.25}
h3{font-size:16px;font-weight:600;line-height:1.3}
p{margin:0}
a{color:var(--accent)}
.mute{color:var(--mute)}.small{font-size:13px}.tiny{font-size:12px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---- Top bar (personal side) ---- */
.topbar{background:var(--rail);color:var(--rail-ink);padding-block:12px;padding-inline:16px}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font:600 18px/1.2 var(--font-head);color:var(--rail-ink)}.brand span{color:var(--brass)}
:root .brand span{color:#d6a64a}
.topbar .btn.ghost{color:var(--rail-ink);border-color:var(--rail-line)}

.page{max-width:1080px;margin:0 auto;padding-block:24px 48px;padding-inline:16px;display:grid;gap:18px}
.narrow{max-width:680px}

/* ---- Buttons ---- */
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none;justify-content:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--mute);padding-inline:8px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{padding:13px 20px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* ---- Cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0;display:grid;gap:12px}
.card.soft{background:var(--accent-soft);border-color:transparent}
.status-line{font-size:13px;color:var(--mute);min-height:1.2em}

/* ---- Welcome ---- */
.welcome h1{margin-bottom:4px}
.checklist{margin:0;padding-left:20px;display:grid;gap:6px}
.consent{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px}
.consent input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}

/* ---- Wizard ---- */
.progress{display:grid;gap:8px}
.progress-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress-bar div{height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.fields{display:grid;gap:18px}
.group-title{font:600 13px/1.3 var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--brass);padding-top:6px;border-top:1px solid var(--line);margin-top:4px;padding-top:14px}
.group-title:first-child{border-top:0;margin-top:0;padding-top:0}
.field{display:grid;gap:6px}
.field label,.field .label{font-weight:600;font-size:15px}
.field .per{font-weight:400;color:var(--mute);font-size:13px}
.field .hint{font-size:13px;color:var(--mute)}
.field input[type=text],.field input[type=number],.field textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.field input:focus{border-color:var(--accent)}
.amount-wrap{position:relative}
.amount-wrap span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.amount-wrap input{padding-left:28px!important}
.echo{font-size:13px;color:var(--accent);min-height:1.2em}
.echo.err{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.item{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px;background:var(--sunk)}
.err-box{color:var(--bad);font-size:14px}
.wiz-nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.saved{font-size:12px;color:var(--mute)}

/* ---- Review ---- */
.review-list{display:grid;gap:0}
.review-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.review-row:last-child{border-bottom:0}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--na-bg);color:var(--na);font-weight:600}
.pill.done{background:var(--good-bg);color:var(--good)}

/* ---- Dashboard ---- */
.dash-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:2px}
.kpi .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
.kpi .v{font:500 26px/1.25 var(--font-num);font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--mute)}
.kpi.lead{background:var(--rail);border-color:var(--rail);color:var(--rail-ink)}
.kpi.lead .k,.kpi.lead .s{color:var(--rail-mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.check{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:6px;align-content:start;background:var(--card)}
.check .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.check .val{font:500 17px/1.3 var(--font-num)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.status.good{background:var(--good-bg);color:var(--good)}.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.bad{background:var(--bad-bg);color:var(--bad)}.status.na{background:var(--na-bg);color:var(--na)}
.stack{display:flex;gap:2px;height:22px}
.stack div{height:100%;min-width:3px}
.stack div:first-child{border-radius:4px 0 0 4px}.stack div:last-child{border-radius:0 4px 4px 0}
.stack div:only-child{border-radius:4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:baseline;flex:none}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.bar-track{height:14px;background:var(--sunk);border-radius:0 4px 4px 0}
.bar-track div{height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.bar-row.out .bar-track div{background:var(--mute)}
.bar-row.total{font-weight:600;border-top:1px solid var(--line);padding-top:10px}
.bar-row.total .bar-track div{background:var(--accent)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:600;border-bottom:0}
.callout{border-left:3px solid var(--good)}
.share{border:1px dashed var(--accent);background:var(--accent-soft)}
textarea.code{font:12px/1.4 var(--font-num);width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.note{font-size:12px;color:var(--mute)}
.tip{position:fixed;z-index:10;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;max-width:240px}

/* ---- Advisor ---- */
.adv{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--rail);color:var(--rail-ink);padding:22px 16px;display:flex;flex-direction:column;gap:10px}
.side .tag{color:var(--rail-mute);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.side nav{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.nav-btn{background:transparent;color:var(--rail-ink);border:1px solid var(--rail-line);padding:10px 12px;border-radius:8px;text-align:left;cursor:pointer;font:inherit;font-size:14px}
.nav-btn.active{background:var(--rail-ink);color:var(--rail);border-color:var(--rail-ink);font-weight:600}
.side-foot{margin-top:auto;display:grid;gap:10px;font-size:12px;color:var(--rail-mute)}
.switch{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--rail-ink);font-size:13px}
.switch input{width:18px;height:18px;accent-color:#d6a64a}
.side a{color:var(--rail-ink)}
.adv-main{padding-block:26px 48px;padding-inline:clamp(16px,3.5vw,36px);display:grid;gap:18px;align-content:start;min-width:0;max-width:1120px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;display:grid;gap:10px;background:var(--sunk)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.profile-list td{vertical-align:middle}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--mute);display:grid;gap:8px;justify-items:center}

@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){
  .adv{grid-template-columns:minmax(0,1fr);min-height:0}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:10px 14px}
  .side .tag{display:none}
  .side nav{flex-direction:row;margin:0;flex-wrap:wrap}
  .side-foot{margin:0;width:100%}
  .bar-row{grid-template-columns:90px minmax(0,1fr) auto}
  .kpi .v{font-size:22px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"><p class="boot">Loading BharatWealth Nexus...</p></div>
<div id="tip" class="tip" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';document.head.appendChild(s)"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';document.head.appendChild(s)"></script>
<script>
/* BharatWealth Nexus rule engine. Pure functions, no DOM access, so it can be unit-tested in Node. */
(function (root) {
  "use strict";

  // Tax tilt fires when the client's marginal slab (before cess) is at least 20%:
  // that is where arbitrage LTCG (12.5%) clearly beats FD interest taxed at slab.
  var TAX_TILT_SLAB = 0.20;
  var STANDARD_DEDUCTION = { New: 75000, Old: 50000 };

  // Base asset-class mix by risk profile (percent of corpus)
  var BASE = {
    Conservative: { equity: 25, gold: 10 },
    Balanced:     { equity: 50, gold: 10 },
    Aggressive:   { equity: 70, gold: 5 }
  };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Slab tables: [upper bound, rate]. Rates are indicative (FY 2025-26 as understood); verify before relying.
  var SLABS = {
    New: [[400000, 0], [800000, .05], [1200000, .10], [1600000, .15], [2000000, .20], [2400000, .25], [Infinity, .30]],
    Old: [[250000, 0], [500000, .05], [1000000, .20], [Infinity, .30]]
  };
  var CESS = 0.04;

  // Slab rate (before cess) on the last rupee of taxable income. Only the standard deduction
  // is applied; other old-regime deductions (80C etc.) are not modelled.
  function slabRate(income, regime) {
    var slabs = SLABS[regime] || SLABS.New;
    var taxable = Math.max(0, income - (STANDARD_DEDUCTION[regime] || 0));
    for (var i = 0; i < slabs.length; i++) {
      if (taxable <= slabs[i][0]) return slabs[i][1];
    }
    return 0.30;
  }

  function marginalRate(income, regime) { return slabRate(income, regime) * (1 + CESS); }

  function validate(input) {
    var errors = [];
    if (!input.name || !String(input.name).trim()) errors.push("Name is required.");
    if (!(input.age >= 18 && input.age <= 90)) errors.push("Age must be between 18 and 90.");
    if (!(input.income >= 0)) errors.push("Income must be zero or more.");
    if (!(input.corpus > 0)) errors.push("Investable corpus must be greater than zero.");
    if (!BASE[input.risk]) errors.push("Choose a valid risk profile.");
    if (input.regime !== "Old" && input.regime !== "New") errors.push("Choose a tax regime.");
    return errors;
  }

  function buildPortfolio(input) {
    var errors = validate(input);
    if (errors.length) return { errors: errors };

    var base = BASE[input.risk];
    // Glide path: ~0.3pt of equity per year away from age 40, capped at +/-10pts.
    var equity = clamp(base.equity - (input.age - 40) * 0.3, base.equity - 10, base.equity + 10);
    equity = Math.round(equity);
    var gold = base.gold;
    var fixed = 100 - equity - gold;

    var taxTilt = slabRate(input.income, input.regime) >= TAX_TILT_SLAB;
    // Clients in the 20%+ slab tilt fixed income toward arbitrage funds for post-tax efficiency.
    var arbShare = taxTilt ? 0.6 : 0.3;
    var arb = Math.round(fixed * arbShare);
    var debt = fixed - arb;

    var nifty50Share = input.risk === "Aggressive" ? 0.6 : 0.7;
    var n50 = Math.round(equity * nifty50Share);
    var next50 = equity - n50;

    var lines = [
      { cls: "Equity", name: "Nifty 50 Index Fund", pct: n50 },
      { cls: "Equity", name: "Nifty Next 50 Index Fund", pct: next50 },
      { cls: "Fixed Income", name: "Short-Term Debt Fund", pct: debt },
      { cls: "Fixed Income", name: "Arbitrage Fund", pct: arb },
      { cls: "Alternatives", name: "Sovereign Gold Bonds (SGB)", pct: gold }
    ].filter(function (l) { return l.pct > 0; });
    lines.forEach(function (l) { l.amount = Math.round(input.corpus * l.pct / 100); });

    var result = {
      errors: [],
      taxTilt: taxTilt,
      lines: lines,
      notes: [
        "Equity glide path: " + equity + "% equity for a " + input.risk + " profile at age " + input.age + ".",
        "SGB: RBI has not been issuing fresh tranches recently (unverified, please check); exposure is typically bought on the exchange secondary market, where price can differ from NAV.",
        "Debt funds bought after 1 Apr 2023 are taxed at slab rate with no indexation; their edge over FDs is liquidity and deferral, not a lower rate."
      ],
      taxInsight: null
    };

    if (taxTilt) result.taxInsight = taxInsight(input);
    return result;
  }

  // Illustrative 1-year comparison of Rs 10L in FD vs arbitrage fund at same pre-tax return.
  function taxInsight(input) {
    var principal = 1000000, gross = 0.07;
    var slab = marginalRate(input.income, input.regime);
    var ltcg = 0.125 * (1 + CESS); // equity-oriented fund held > 12 months, above Rs 1.25L annual exemption
    var stcg = 0.20 * (1 + CESS);  // held <= 12 months
    var pre = principal * gross;
    var fdNet = pre * (1 - slab);
    var arbNetLong = pre * (1 - ltcg); // exemption ignored (conservative)
    var arbNetShort = pre * (1 - stcg);
    return {
      slabRate: slab, ltcgRate: ltcg, stcgRate: stcg,
      fdNet: Math.round(fdNet), arbNetLong: Math.round(arbNetLong), arbNetShort: Math.round(arbNetShort),
      annualSavingLong: Math.round(arbNetLong - fdNet),
      text:
        "Your income puts you in roughly a " + (slab * 100).toFixed(1) +
        "% marginal bracket (incl. 4% cess, before surcharge) under the " + input.regime + " regime. " +
        "FD interest is taxed at that slab rate every year, even if you reinvest it. " +
        "Arbitrage funds are taxed as equity-oriented funds: LTCG at 12.5% (+cess) on gains above ₹1.25 lakh a year when held beyond 12 months, " +
        "and STCG at 20% (+cess) otherwise, and tax falls due only when you redeem. " +
        "On ₹10 lakh at an assumed 7% pre-tax return, an FD nets about ₹" + fmt(fdNet) +
        " after tax, versus about ₹" + fmt(arbNetLong) + " for an arbitrage fund held over 12 months (before using the ₹1.25 lakh exemption)."
    };
  }

  // ---------- Personal profile analysis ----------

  // Accepts "12,50,000", "12.5 lakh", "12.5L", "1.2 cr", "50k", "₹ 4000". Returns a number, or null if blank, or NaN if unreadable.
  function parseAmount(raw) {
    if (raw === null || raw === undefined) return null;
    if (typeof raw === "number") return isFinite(raw) ? raw : NaN;
    var s = String(raw).toLowerCase().replace(/₹|rs\.?|inr|,|\s/g, "");
    if (!s) return null;
    var m = s.match(/^(\d+(?:\.\d+)?)(k|thousand|l|lac|lacs|lakh|lakhs|cr|crore|crores)?$/);
    if (!m) return NaN;
    var mult = { k: 1e3, thousand: 1e3, l: 1e5, lac: 1e5, lacs: 1e5, lakh: 1e5, lakhs: 1e5, cr: 1e7, crore: 1e7, crores: 1e7 }[m[2]] || 1;
    return Math.round(parseFloat(m[1]) * mult);
  }

  function num(v) { var n = Number(v); return isFinite(n) && n > 0 ? n : 0; }
  function sum(obj, keys) { return keys.reduce(function (s, k) { return s + num(obj && obj[k]); }, 0); }

  var ASSET_GROUPS = [
    { id: "bank", label: "Bank & deposits", keys: ["savings", "fd"] },
    { id: "market", label: "Mutual funds & shares", keys: ["equityMf", "debtMf", "stocks"] },
    { id: "retirement", label: "Retirement (EPF, PPF, NPS)", keys: ["epf", "ppf", "nps"] },
    { id: "gold", label: "Gold", keys: ["gold", "sgb"] },
    { id: "property", label: "Property", keys: ["home", "property"] },
    { id: "other", label: "Other", keys: ["smallSavings", "other"] }
  ];

    var doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });

    var ink = [24, 34, 31], mute = [93, 106, 101], teal = [15, 107, 90], line = [221, 227, 223];
    var name = (p.about && p.about.name) || "Your";

    function header() {
      doc.setFillColor(15, 59, 51); doc.rect(0, 0, W, 58, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(255, 255, 255); doc.text("BharatWealth Nexus", M, 36);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9);
      doc.text("Wealth report  |  " + dateIN(), W - M, 36, { align: "right" });
      y = 88;
    }
    function ensure(h) { if (y + h > H - M) { doc.addPage(); header(); } }
    function text(t, size, color, style, x, opts) {
      doc.setFont("helvetica", style || "normal"); doc.setFontSize(size); doc.setTextColor.apply(doc, color || ink);
      var lines = doc.splitTextToSize(pdfText(t), (opts && opts.width) || (W - 2 * M));
      ensure(lines.length * size * 1.35);
      doc.text(lines, x || M, y); y += lines.length * size * 1.35;
    }
    function heading(t) { y += 10; ensure(40); text(t, 12.5, teal, "bold"); y += 2; }
    // cols: [{label, width, align}] widths in fractions of content width
    function table(cols, rows, opts) {
      var cw = W - 2 * M, xs = [], x = M;
      cols.forEach(function (c) { xs.push(x); x += c.width * cw; });
      function row(cells, bold, color) {
        var wrapped = cells.map(function (c, i) { return doc.splitTextToSize(pdfText(c), cols[i].width * cw - 8); });
        var h = Math.max.apply(null, wrapped.map(function (w) { return w.length; })) * 12 + 8;
        ensure(h);
        doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(bold ? 8 : 9.5);
        wrapped.forEach(function (w, i) {
          var col = cols[i], c = (color && color[i]) || (bold ? mute : ink);
          doc.setTextColor.apply(doc, c);
          if (col.align === "right") doc.text(w, xs[i] + col.width * cw - 4, y + 10, { align: "right" });
          else doc.text(w, xs[i], y + 10);
        });
        y += h; doc.setDrawColor.apply(doc, line); doc.line(M, y - 3, W - M, y - 3);
      }
      row(cols.map(function (c) { return c.label.toUpperCase(); }), true);
      rows.forEach(function (r) { row(r.cells || r, false, r.colors); });
      if (opts && opts.total) row(opts.total, true);
      y += 4;
    }

    header();
    text(name + (name === "Your" ? " wealth report" : ""), 18, ink, "bold"); y += 2;
    var ab = p.about || {};
    text([ab.age ? "Age " + ab.age : "", ab.city, ab.occupation, a.riskProfile + " investor", a.regime + " tax regime",
      "Last updated " + dateIN(p.updatedAt)].filter(Boolean).join("  |  "), 9.5, mute);
    y += 10;

    // KPI strip
    var kpis = [["Net worth", inr(a.netWorth)], ["Monthly surplus", inr(a.surplus)], ["Total loans", inr(a.totalLoans)],
      ["Emergency fund", a.emergencyMonths === null ? "-" : a.emergencyMonths.toFixed(1) + " months"]];
    var kw = (W - 2 * M - 3 * 10) / 4;
    ensure(56);
    kpis.forEach(function (k, i) {
      var x = M + i * (kw + 10);
      doc.setDrawColor.apply(doc, line); doc.roundedRect(x, y, kw, 48, 4, 4, "S");
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor.apply(doc, mute); doc.text(k[0].toUpperCase(), x + 8, y + 15);
      doc.setFont("helvetica", "bold"); doc.setFontSize(12.5); doc.setTextColor.apply(doc, ink); doc.text(pdfText(k[1]), x + 8, y + 36);
    });
    y += 62;

    heading("Health check");
    table([{ label: "Area", width: .22 }, { label: "Status", width: .16 }, { label: "Where you are", width: .2 }, { label: "What it means", width: .42 }],
      a.checks.map(function (c) { return { cells: [c.title, STATUS[c.status], c.value, c.detail], colors: [null, STATUS_RGB[c.status]] }; }));

    heading("Monthly cash flow");
    table([{ label: "Item", width: .7 }, { label: "Per month", width: .3, align: "right" }], [
      ["Income (including bonus spread over 12 months)", inr(a.monthlyIncome)], ["Spending (including insurance premiums)", "- " + inr(a.monthlySpend)],
      ["Loan EMIs", "- " + inr(a.monthlyEmi)], ["Existing SIPs and RDs", "- " + inr(a.monthlySip)]
    ], { total: ["Left over", inr(a.surplus)] });

    heading("What you own");
    table([{ label: "Category", width: .55 }, { label: "Value", width: .25, align: "right" }, { label: "Share", width: .2, align: "right" }],
      a.groups.filter(function (g) { return g.value; }).map(function (g) {
        return [g.label, inr(g.value), Math.round(g.value / a.totalAssets * 100) + "%"];
      }), { total: ["Total assets", inr(a.totalAssets), "100%"] });

    if (a.loans.length) {
      heading("What you owe");
      table([{ label: "Loan", width: .26 }, { label: "Outstanding", width: .22, align: "right" }, { label: "EMI", width: .18, align: "right" },
        { label: "Rate", width: .14, align: "right" }, { label: "Years left", width: .2, align: "right" }],
        a.loans.map(function (l) { return [l.type || "Loan", inr(l.outstanding), inr(l.emi), l.rate ? l.rate + "%" : "-", l.yearsLeft || "-"]; }),
        { total: ["Total", inr(a.totalLoans), inr(a.monthlyEmi), "", ""] });
    }

    var insr = p.insurance || {};
    if (!(p.skipped && p.skipped.insurance)) {
      heading("Insurance");
      table([{ label: "Cover", width: .7 }, { label: "Amount", width: .3, align: "right" }], [
        ["Term life", inr(insr.term)], ["Other life (LIC, endowment, ULIP)", inr(insr.otherLife)],
        ["Health, own policy", inr(insr.health)], ["Health, from employer", inr(insr.employerHealth)]]);
    }

    if (a.goals.length) {
      heading("Goals");
      table([{ label: "Goal", width: .26 }, { label: "Years", width: .1, align: "right" }, { label: "Cost today", width: .2, align: "right" },
        { label: "Cost then", width: .2, align: "right" }, { label: "Monthly SIP needed", width: .24, align: "right" }],
        a.goals.map(function (g) { return [g.name, String(g.years), inr(g.amount), inr(g.futureCost), inr(g.monthlyNeeded)]; }),
        { total: ["Total", "", "", "", inr(a.goalSip)] });
      var longGoal = a.goals.find(function (g) { return g.years > 3; });
      text("Costs grow at 6% a year for inflation. Assumed returns: 6.5% for goals within 3 years" +
        (longGoal ? ", " + Math.round(longGoal.rate * 100) + "% for longer goals (" + a.riskProfile.toLowerCase() + " investor)." : "."), 8.5, mute);
    }

    heading("Where to put your monthly surplus");
    text(a.investable ? "Suggested split of the " + inr(a.investable) + " you have left each month:" :
      "You have no surplus left each month right now. This is the split to use once you do:", 9.5);
    y += 4;
    table([{ label: "Asset class", width: .25 }, { label: "Fund type", width: .45 }, { label: "Share", width: .12, align: "right" },
      { label: "Per month", width: .18, align: "right" }],
      a.split.lines.map(function (l) { return [l.cls, l.name, l.pct + "%", a.investable ? inr(a.investable * l.pct / 100) : "-"]; }));
    if (a.split.taxInsight) { y += 2; text(a.split.taxInsight.text, 9); }

    y += 12;
    text("This report is generated from the figures entered and simple rules of thumb. It is not investment, tax or legal advice. " +
      "Tax rates are indicative for FY 2025-26. Mutual fund investments are subject to market risks; read all scheme-related documents carefully.", 7.5, mute);

    return { filename: "Wealth-Report-" + slug(name) + ".pdf", blob: doc.output("blob") };
  }

  // ---------- Excel workbook ----------
  var DATA_SHEET = "_profile_data";
  function reportXlsx(p, a) {
    if (!window.XLSX) throw new Error("The Excel tool has not loaded. Check your internet connection and reload the page.");
    var X = window.XLSX, wb = X.utils.book_new(), ab = p.about || {};
    function sheet(name, aoa, widths) {
      var ws = X.utils.aoa_to_sheet(aoa); ws["!cols"] = (widths || []).map(function (w) { return { wch: w }; });
      X.utils.book_append_sheet(wb, ws, name);
    }
    sheet("Summary", [
      ["BharatWealth Nexus - Wealth report"], ["Name", ab.name || ""], ["Age", ab.age || ""], ["City", ab.city || ""],
      ["Risk profile", a.riskProfile], ["Tax regime", a.regime], ["Last updated", dateIN(p.updatedAt)], [],
      ["Net worth (INR)", Math.round(a.netWorth)], ["Total assets (INR)", Math.round(a.totalAssets)], ["Total loans (INR)", Math.round(a.totalLoans)],
      ["Monthly income (INR)", Math.round(a.monthlyIncome)], ["Monthly spending (INR)", Math.round(a.monthlySpend)],
      ["Monthly EMIs (INR)", Math.round(a.monthlyEmi)], ["Monthly SIPs (INR)", Math.round(a.monthlySip)], ["Monthly surplus (INR)", Math.round(a.surplus)],
      [], ["Health check", "Status", "Where you are", "What it means"]
    ].concat(a.checks.map(function (c) { return [c.title, STATUS[c.status], c.value.replace(/₹/g, "Rs "), c.detail.replace(/₹/g, "Rs ")]; })),
      [26, 18, 22, 90]);

    var inc = p.income || {}, sp = p.spending || {}, as = p.assets || {}, insr = p.insurance || {};
    function rowsFor(stepId, obj) {
      var step = Questions.STEPS.find(function (s) { return s.id === stepId; });
      return Questions.fieldsOf(step).map(function (f) {
        return [f.label + (f.per ? " (per " + f.per + ")" : ""), Number(obj[f.key]) || 0];
      });
    }
    sheet("Income", [["Item", "Amount (INR)"]].concat(rowsFor("income", inc)), [46, 16]);
    sheet("Spending", [["Item", "Amount (INR)"]].concat(rowsFor("spending", sp)), [46, 16]);
    sheet("Assets", [["Item", "Value (INR)"]].concat(rowsFor("assets", as)).concat([[], ["Total assets", Math.round(a.totalAssets)]]), [46, 16]);
    sheet("Loans", [["Type", "Outstanding (INR)", "EMI (INR)", "Rate (%)", "Years left"]].concat((p.loans || []).map(function (l) {
      return [l.type || "", Number(l.outstanding) || 0, Number(l.emi) || 0, Number(l.rate) || 0, Number(l.yearsLeft) || 0];
    })), [18, 18, 12, 10, 10]);
    sheet("Insurance", [["Cover", "Amount (INR)"]].concat(rowsFor("insurance", insr)), [46, 16]);
    sheet("Goals", [["Goal", "Years", "Cost today (INR)", "Cost then (INR)", "Already saved (INR)", "Monthly SIP needed (INR)"]].concat(
      a.goals.map(function (g) { return [g.name, g.years, g.amount, g.futureCost, g.saved, g.monthlyNeeded]; })), [26, 8, 16, 16, 18, 22]);
    sheet("Suggested split", [["Asset class", "Fund type", "Share (%)", "Per month (INR)"]].concat(
      a.split.lines.map(function (l) { return [l.cls, l.name, l.pct, Math.round(a.investable * l.pct / 100)]; })), [16, 30, 10, 16]);

    // Hidden sheet carrying the full profile so this same file can be imported by the advisor.
    var json = Store.toJson(p), chunks = [];
    for (var i = 0; i < json.length; i += 30000) chunks.push([json.slice(i, i + 30000)]);
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(chunks), DATA_SHEET);
    wb.Workbook = { Sheets: wb.SheetNames.map(function (n) { return { Hidden: n === DATA_SHEET ? 1 : 0 }; }) };

    var buf = X.write(wb, { bookType: "xlsx", type: "array" });
    return { filename: "Wealth-Report-" + slug(ab.name) + ".xlsx",
      blob: new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }) };
  }

  function profileFile(p) {
    return { filename: "BharatWealth-Profile-" + slug(p.about && p.about.name) + ".json",
      blob: new Blob([Store.toJson(p)], { type: "application/json" }) };
  }

  // Reads a dropped/selected file (.json or the .xlsx above). Resolves {profile} or {error}.
  function readImportFile(file) {
    return new Promise(function (resolve) {
      var isXlsx = /\.xlsx$/i.test(file.name);
      var fr = new FileReader();
      fr.onerror = function () { resolve({ error: "Could not read that file." }); };
      fr.onload = function () {
        if (!isXlsx) return resolve(Store.parseTransfer(fr.result));
        if (!window.XLSX) return resolve({ error: "The Excel tool has not loaded. Check your internet connection and reload." });
        try {
          var wb = window.XLSX.read(new Uint8Array(fr.result), { type: "array" });
          var ws = wb.Sheets[DATA_SHEET];
          if (!ws) return resolve({ error: "This Excel file was not exported from BharatWealth Nexus." });
          var rows = window.XLSX.utils.sheet_to_json(ws, { header: 1 });
          resolve(Store.parseTransfer(rows.map(function (r) { return r[0] || ""; }).join("")));
        } catch (e) { resolve({ error: "Could not read that Excel file." }); }
      };
      if (isXlsx) fr.readAsArrayBuffer(file); else fr.readAsText(file);
    });
  }

  // ---------- Demo client book (advisor demo tab) ----------
  function clientBookXlsx(clients) {
    if (!window.XLSX) throw new Error("The Excel tool has not loaded. Check your internet connection and reload the page.");
    var X = window.XLSX;
    var ws = X.utils.json_to_sheet(clients.map(function (c) {
      return { "Client": c.name, "City": c.city, "Age": c.age, "Annual Income (INR)": c.income, "AUM (INR)": c.aum, "Risk Profile": c.risk, "Tax Regime": c.regime };
    }));
    ws["!cols"] = [{ wch: 24 }, { wch: 12 }, { wch: 6 }, { wch: 20 }, { wch: 16 }, { wch: 14 }, { wch: 11 }];
    var wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "Demo clients");
    return { filename: "BharatWealth-Demo-Client-Book.xlsx",
      blob: new Blob([X.write(wb, { bookType: "xlsx", type: "array" })], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }) };
  }

  window.Exports = { saveFile: saveFile, reportPdf: reportPdf, reportXlsx: reportXlsx, profileFile: profileFile,
    readImportFile: readImportFile, clientBookXlsx: clientBookXlsx };
})();
</script>
<script>
/* UI layer: routing, guided setup, dashboards, advisor view. Finance logic lives in engine.js,
   questions in questions.js, persistence in store.js, files in exports.js.
   Routes: no hash = the family member's own profile; #advisor = the advisor's view. */
(function () {
  "use strict";

  var ADVISOR = "Bharat"; // shown in the consent text and the share card
  var STEPS = Questions.STEPS;
  var app = document.getElementById("app");
  var tip = document.getElementById("tip");

  // ---------- helpers ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function inr(n) { return Engine.inr(Math.round(n || 0)); }
  function indian(n) { return n === undefined || n === null || n === "" ? "" : Number(n).toLocaleString("en-IN"); }
  function dateIN(iso) { return iso ? new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "-"; }
  function firstName(p) { return ((p.about && p.about.name) || "").trim().split(/\s+/)[0] || "Your"; }
  function possessive(name) { return name === "Your" ? "Your" : name + "'s"; }
  function top() { window.scrollTo(0, 0); }

  // ---------- state ----------
  var me = null;            // this device's own profile
  var personalView = null;  // "welcome" | "wizard" | "review" | "dashboard"
  var stepIdx = 0;
  var advTab = "family";    // "family" | "demo" | "detail"
  var detail = null;        // { profile, from }

  function isAdvisor() { return location.hash.replace("#", "") === "advisor"; }
  function render() { if (isAdvisor()) renderAdvisor(); else renderPersonal(); }
  window.addEventListener("hashchange", function () { render(); top(); });

  // ---------- tooltip for chart marks ----------
  document.addEventListener("mousemove", function (e) {
    var t = e.target.closest && e.target.closest("[data-tip]");
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.getAttribute("data-tip"); tip.hidden = false;
    var x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px";
  });

  // =====================================================================
  // PERSONAL SIDE
  // =====================================================================
  function renderPersonal() {
    me = Store.loadMine();
    if (!me || !me.consentAt) personalView = "welcome";
    else if (!personalView || personalView === "welcome") {
      personalView = me.completedAt ? "dashboard" : "wizard";
      stepIdx = Math.min(me.step || 0, STEPS.length - 1);
    }
    ({ welcome: renderWelcome, wizard: renderWizard, review: renderReview, dashboard: renderOwnDashboard })[personalView]();
  }

  function topbar(right) {
    return '<header class="topbar"><div class="topbar-in"><span class="brand">BharatWealth <span>Nexus</span></span>' +
      '<div class="row">' + (right || "") + "</div></div></header>";
  }

  // ---------- welcome + consent ----------
  function renderWelcome() {
    app.innerHTML = topbar() +
      '<main class="page narrow welcome"><div class="card">' +
      '<p class="eyebrow">Your personal wealth check</p>' +
      "<h1>See your whole financial picture in one place</h1>" +
      "<p>Answer simple questions about your income, savings, loans and insurance. It takes about 10 minutes. " +
      "Skip anything that does not apply and come back to it later.</p>" +
      '<ul class="checklist"><li>Your net worth and where your money sits</li><li>Health checks on emergency savings, loans and insurance</li>' +
      "<li>How much to invest each month for your goals</li><li>A PDF report and an Excel file you can download</li></ul>" +
      '<div class="consent"><input type="checkbox" id="consent"><label for="consent"><strong>Everything you enter will be visible to ' + ADVISOR +
      ".</strong> " + ADVISOR + " set up this tool to help look after your family's finances. Your answers are saved only on this device " +
      "until you send your profile to " + ADVISOR + " from your dashboard.</label></div>" +
      '<p class="err-box" id="consent-err" hidden>Tick the box above to continue.</p>' +
      '<div><button class="btn big" id="start">Start</button></div></div>' +
      '<p class="note">This tool gives general guidance from the figures you enter. It is not investment, tax or legal advice.</p></main>';
    $("start").onclick = function () {
      if (!$("consent").checked) { $("consent-err").hidden = false; return; }
      me = Store.newProfile(); me.consentAt = new Date().toISOString(); Store.saveMine(me);
      stepIdx = 0; personalView = "wizard"; render(); top();
    };
  }

  // ---------- wizard ----------
  var saveTimer = null;
  function saveSoon() {
    var el = $("saved"); if (el) el.textContent = "Saving...";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var ok = Store.saveMine(me), s = $("saved");
      if (s) s.textContent = ok ? "Saved on this device" : "Not saved: this browser blocks storage. Keep this page open.";
    }, 300);
  }

  function fieldHtml(f, value, sec, idx) {
    var id = "f-" + sec + "-" + (idx === "" ? "" : idx + "-") + f.key;
    var data = ' data-sec="' + sec + '" data-idx="' + idx + '" data-key="' + f.key + '" data-type="' + f.type + '"';
    var label = esc(f.label) + (f.per ? ' <span class="per">per ' + f.per + "</span>" : "") + (f.required ? "" : "");
    var input;
    if (f.type === "choice") {
      input = '<div class="chips" role="group" aria-label="' + esc(f.label) + '">' + f.options.map(function (o) {
        var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o;
        return '<button type="button" class="chip" id="' + id + "-" + esc(v).replace(/\W/g, "") + '" data-val="' + esc(v) + '"' + data +
          ' aria-pressed="' + (value === v) + '">' + esc(t) + "</button>";
      }).join("") + "</div>";
      return '<div class="field"><span class="label">' + label + "</span>" + input + (f.hint ? '<p class="hint">' + esc(f.hint) + "</p>" : "") + "</div>";
    }
    if (f.type === "amount") {
      input = '<div class="amount-wrap"><span>₹</span><input type="text" inputmode="decimal" autocomplete="off" id="' + id + '"' + data +
        ' value="' + esc(indian(value)) + '" placeholder="0"></div><p class="echo" id="' + id + '-echo">' + echo(value, f) + "</p>";
    } else if (f.type === "count") {
      input = '<input type="number" inputmode="decimal" id="' + id + '"' + data + ' value="' + esc(value === undefined ? "" : value) + '"' +
        (f.min !== undefined ? ' min="' + f.min + '"' : "") + (f.max !== undefined ? ' max="' + f.max + '"' : "") + ' step="' + (f.step || 1) + '">';
    } else {
      input = '<input type="text" id="' + id + '"' + data + ' value="' + esc(value || "") + '" placeholder="' + esc(f.placeholder || "") + '" autocomplete="off">';
    }
    return '<div class="field"><label for="' + id + '">' + label + "</label>" + input + (f.hint ? '<p class="hint">' + esc(f.hint) + "</p>" : "") + "</div>";
  }

  function echo(value, f) {
    if (value === undefined || value === null || value === "") return "";
    return "= " + inr(value) + (f.per ? " per " + f.per : "");
  }

  function stepHtml(step) {
    var sec = step.id;
    if (step.list) {
      var items = me[sec] || [];
      return items.map(function (it, i) {
        return '<div class="item"><div class="spread"><h3>' + esc(step.list.itemTitle) + " " + (i + 1) + "</h3>" +
          '<button type="button" class="btn quiet" data-remove="' + i + '">Remove</button></div>' +
          step.list.fields.map(function (f) { return fieldHtml(f, it[f.key], sec, i); }).join("") + "</div>";
      }).join("") + '<div><button type="button" class="btn ghost" id="add-item">+ ' + esc(step.list.addLabel) + "</button></div>";
    }
    var vals = me[sec] || {};
    if (step.groups) return step.groups.map(function (g) {
      return '<p class="group-title">' + esc(g.title) + "</p>" + g.fields.map(function (f) { return fieldHtml(f, vals[f.key], sec, ""); }).join("");
    }).join("");
    return step.fields.map(function (f) { return fieldHtml(f, vals[f.key], sec, ""); }).join("");
  }

  function renderWizard() {
    var step = STEPS[stepIdx], last = stepIdx === STEPS.length - 1;
    var skipLabel = step.id === "about" ? "" : step.list ? step.list.noneLabel : "Skip this step";
    app.innerHTML = topbar(me.completedAt ? '<button class="btn ghost" id="to-dash">Back to dashboard</button>' : "") +
      '<main class="page narrow"><div class="progress"><div class="spread"><span class="eyebrow">Step ' + (stepIdx + 1) + " of " + STEPS.length +
      '</span><span class="saved" id="saved">Saved on this device</span></div>' +
      '<div class="progress-bar"><div style="width:' + Math.round((stepIdx + 1) / STEPS.length * 100) + '%"></div></div></div>' +
      '<form class="card" id="wiz" novalidate><h1>' + esc(step.title) + '</h1><p class="mute">' + esc(step.intro) + "</p>" +
      '<div class="fields" id="fields">' + stepHtml(step) + "</div>" +
      '<p class="err-box" id="wiz-err" hidden></p>' +
      '<div class="wiz-nav"><button type="button" class="btn quiet" id="back"' + (stepIdx === 0 ? " hidden" : "") + ">Back</button>" +
      '<div class="row">' + (skipLabel ? '<button type="button" class="btn ghost" id="skip">' + esc(skipLabel) + "</button>" : "") +
      '<button type="submit" class="btn" id="next">' + (last ? "Review my answers" : "Save and continue") + "</button></div></div></form></main>";

    var fields = $("fields");
    fields.addEventListener("input", onFieldInput);
    fields.addEventListener("focusout", function (e) {
      var t = e.target;
      if (t.dataset && t.dataset.type === "amount") { var n = Engine.parseAmount(t.value); if (n !== null && !isNaN(n)) t.value = indian(n); }
    });
    fields.addEventListener("click", function (e) {
      var chip = e.target.closest(".chip");
      if (chip) {
        var on = chip.getAttribute("aria-pressed") !== "true";
        chip.parentNode.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", "false"); });
        chip.setAttribute("aria-pressed", String(on));
        setVal(chip.dataset.sec, chip.dataset.idx, chip.dataset.key, on ? chip.dataset.val : null);
        return;
      }
      var rm = e.target.closest("[data-remove]");
      if (rm) { me[step.id].splice(Number(rm.dataset.remove), 1); saveSoon(); rerenderFields(step); return; }
      if (e.target.id === "add-item") {
        me[step.id] = me[step.id] || []; me[step.id].push({}); delete me.skipped[step.id]; saveSoon(); rerenderFields(step);
        var items = fields.querySelectorAll(".item"); if (items.length) items[items.length - 1].scrollIntoView({ block: "nearest" });
      }
    });
    if ($("to-dash")) $("to-dash").onclick = function () { personalView = "dashboard"; render(); top(); };
    $("back").onclick = function () { stepIdx--; me.step = stepIdx; saveSoon(); renderWizard(); top(); };
    if ($("skip")) $("skip").onclick = function () {
      if (step.id === "loans") { me.loans = []; delete me.skipped.loans; } else me.skipped[step.id] = true;
      advance();
    };
    $("wiz").onsubmit = function (e) {
      e.preventDefault();
      var err = validateStep(step);
      if (err) { $("wiz-err").textContent = err; $("wiz-err").hidden = false; return; }
      delete me.skipped[step.id];
      advance();
    };
  }

  function rerenderFields(step) { $("fields").innerHTML = stepHtml(step); }

  function onFieldInput(e) {
    var t = e.target, d = t.dataset;
    if (!d || !d.key) return;
    $("wiz-err").hidden = true;
    var val;
    if (d.type === "amount") {
      var n = Engine.parseAmount(t.value), out = $(t.id + "-echo");
      var f = fieldDef(d.sec, d.key);
      if (n === null) { val = null; out.textContent = ""; out.className = "echo"; }
      else if (isNaN(n)) { val = undefined; out.textContent = "Could not read this. Try 45000, 4.5 lakh or 1.2 crore."; out.className = "echo err"; }
      else { val = n; out.textContent = echo(n, f); out.className = "echo"; }
      if (val === undefined) return; // keep the last good value until the entry is readable
    } else if (d.type === "count") val = t.value === "" ? null : Number(t.value);
    else val = t.value;
    setVal(d.sec, d.idx, d.key, val);
  }

  function fieldDef(sec, key) {
    var step = STEPS.find(function (s) { return s.id === sec; });
    var list = step.list ? step.list.fields : Questions.fieldsOf(step);
    return list.find(function (f) { return f.key === key; }) || {};
  }

  function setVal(sec, idx, key, val) {
    var target;
    if (idx === "" || idx === undefined) target = me[sec] = me[sec] || {};
    else target = me[sec][Number(idx)];
    if (val === null || val === "" || val === undefined) delete target[key]; else target[key] = val;
    delete me.skipped[sec];
    saveSoon();
  }

  function validateStep(step) {
    if (document.querySelector("#fields .echo.err")) return "Fix the amounts marked in red, or clear them.";
    var problems = [];
    function check(f, v, where) {
      if (f.required && (v === undefined || v === "" || v === null)) problems.push(f.label + " is needed" + where + ".");
      if (f.type === "count" && v !== undefined && v !== null && v !== "" &&
        (isNaN(v) || (f.min !== undefined && v < f.min) || (f.max !== undefined && v > f.max)))
        problems.push(f.label + where + " should be between " + f.min + " and " + f.max + ".");
    }
    if (step.list) (me[step.id] || []).forEach(function (it, i) {
      step.list.fields.forEach(function (f) { check(f, it[f.key], " (" + step.list.itemTitle.toLowerCase() + " " + (i + 1) + ")"); });
    });
    else Questions.fieldsOf(step).forEach(function (f) { check(f, (me[step.id] || {})[f.key], ""); });
    return problems.join(" ");
  }

  function advance() {
    clearTimeout(saveTimer);
    if (stepIdx < STEPS.length - 1) { stepIdx++; me.step = stepIdx; Store.saveMine(me); renderWizard(); }
    else { me.step = STEPS.length - 1; Store.saveMine(me); personalView = "review"; renderReview(); }
    top();
  }

  // ---------- review ----------
  function stepSummary(step) {
    if (me.skipped && me.skipped[step.id]) return { text: "Skipped", done: false };
    if (step.list) {
      var n = (me[step.id] || []).length;
      return { text: n ? n + " " + step.list.itemTitle.toLowerCase() + (n > 1 ? "s" : "") : "None", done: true };
    }
    var fs = Questions.fieldsOf(step), vals = me[step.id] || {};
    var answered = fs.filter(function (f) { return vals[f.key] !== undefined && vals[f.key] !== ""; }).length;
    return { text: answered + " of " + fs.length + " answered", done: answered > 0 };
  }

    }
    var list = Store.listFamily().sort(function (x, y) { return (y.updatedAt || "").localeCompare(x.updatedAt || ""); });
    main.innerHTML = '<div><h1>Family profiles</h1><p class="mute">Profiles your family sent you. They are stored only in this browser.</p></div>' +
      '<div class="drop" id="drop"><h3>Add or update a profile</h3>' +
      '<p class="small mute">Drop the .json or .xlsx file they sent, or choose it. A newer file from the same person replaces the older one.</p>' +
      '<div class="row"><label class="btn" for="file-in">Choose file</label><input type="file" id="file-in" accept=".json,.xlsx,application/json" hidden>' +
      '<button type="button" class="btn ghost" id="paste-toggle">Paste text instead</button></div>' +
      '<div id="paste-area" class="field" hidden><label for="paste-box">Text they sent (starts with BWN1:)</label>' +
      '<textarea class="code" id="paste-box"></textarea><div><button type="button" class="btn" id="paste-go">Import text</button></div></div>' +
      '<p class="status-line" id="imp-status"></p></div>' +
      (list.length ? '<section class="card"><div class="table-wrap"><table class="profile-list"><thead><tr><th>Name</th><th>Age · City</th>' +
        '<th class="r">Net worth</th><th class="r">Left over / month</th><th>Health</th><th>Last updated</th><th></th></tr></thead><tbody>' +
        list.map(function (p) {
          var a = Engine.analyzeProfile(p);
          return "<tr><td><strong>" + esc((p.about && p.about.name) || "Unnamed") + "</strong></td><td>" + esc([p.about && p.about.age, p.about && p.about.city].filter(Boolean).join(" · ") || "-") +
            '</td><td class="r">' + inr(a.netWorth) + '</td><td class="r">' + inr(a.surplus) + "</td><td>" +
            (a.alerts ? statusChip("bad").replace("Act now", a.alerts + " to act on") : statusChip("good").replace("Good", "No urgent issues")) +
            "</td><td>" + dateIN(p.updatedAt) + '</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn ghost" data-open="' + esc(p.id) + '">Open</button>' +
            '<button class="btn quiet" data-del="' + esc(p.id) + '">Delete</button></div></td></tr>';
        }).join("") + "</tbody></table></div></section>"
        : '<div class="empty"><h2>No family profiles yet</h2><p>Send your family the site link without #advisor at the end. ' +
          "When they finish, they send you a profile file from their dashboard. Import it here.</p></div>");

    var drop = $("drop");
    ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function () { drop.classList.remove("over"); }); });
    drop.addEventListener("drop", function (e) { e.preventDefault(); if (e.dataTransfer.files[0]) importFile(e.dataTransfer.files[0]); });
    $("file-in").onchange = function () { if (this.files[0]) importFile(this.files[0]); this.value = ""; };
    $("paste-toggle").onclick = function () { $("paste-area").hidden = !$("paste-area").hidden; };
    $("paste-go").onclick = function () { finishImport(Store.parseTransfer($("paste-box").value)); };
    main.querySelectorAll("[data-open]").forEach(function (b) {
      b.onclick = function () { detail = { profile: Store.getFamily(b.dataset.open), from: "family" }; renderAdvMain(); top(); };
    });
    main.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.armed) { Store.deleteFamily(b.dataset.del); renderAdvMain(); return; }
        b.dataset.armed = "1"; b.textContent = "Confirm delete"; b.className = "btn danger";
        setTimeout(function () { if (b.isConnected) { delete b.dataset.armed; b.textContent = "Delete"; b.className = "btn quiet"; } }, 4000);
      };
    });
  }

  function importFile(file) {
    $("imp-status").textContent = "Reading " + file.name + "...";
    Exports.readImportFile(file).then(finishImport);
  }
  function finishImport(res) {
    if (res.error) { $("imp-status").textContent = res.error; return; }
    var r = Store.upsertFamily(res.profile), name = (res.profile.about && res.profile.about.name) || "Profile";
    if (!r.ok && r.reason === "older") { $("imp-status").textContent = "You already have a newer version of " + name + "'s profile. Nothing changed."; return; }
    if (!r.ok) { $("imp-status").textContent = "This browser blocked saving. Try a normal (not private) window."; return; }
    renderAdvMain();
    $("imp-status").textContent = (r.replaced ? "Updated " : "Added ") + name + ".";
  }

  function renderDetail(main) {
    var p = detail.profile;
    if (!p) { detail = null; return renderAdvMain(); }
    var a = Engine.analyzeProfile(p);
    main.innerHTML = '<div><button class="btn quiet" id="back-list">← ' + (detail.from === "demo" ? "Demo clients" : "All family profiles") + "</button></div>" +
      dashboardHtml(p, a, { own: false, label: detail.from === "demo" ? "Sample profile (fictional)" : "Family profile" });
    bindDashboard(p, a);
    $("back-list").onclick = function () { advTab = detail.from; detail = null; renderAdvMain(); top(); };
  }

  function renderDemo(main) {
    var aum = MOCK.reduce(function (s, c) { return s + c.aum; }, 0);
    main.innerHTML = '<div class="spread"><div><h1>Demo clients</h1><p class="mute">Fictional HNWI book for demonstrations.</p></div>' +
      '<div class="row"><button class="btn ghost" id="demo-xlsx">Export client book (.xlsx)</button><button class="btn" id="open-sample">Open sample dashboard</button></div></div>' +
      '<p class="status-line" id="demo-status"></p>' +
      '<div class="kpis">' + kpi("Total AUM managed", inr(aum), "Across " + MOCK.length + " clients", "lead") +
      kpi("Client count", String(MOCK.length), "Fictional HNWI book") + kpi("Average client AUM", inr(aum / MOCK.length), "Per client") + "</div>" +
      '<section class="card"><div class="table-wrap"><table><thead><tr><th>Client</th><th>City</th><th class="r">Age</th><th class="r">Annual income</th>' +
      '<th class="r">AUM</th><th>Risk</th><th>Tax regime</th></tr></thead><tbody>' + MOCK.map(function (c) {
        return "<tr><td>" + esc(c.name) + "</td><td>" + esc(c.city) + '</td><td class="r">' + c.age + '</td><td class="r">' + inr(c.income) +
          '</td><td class="r">' + inr(c.aum) + "</td><td>" + esc(c.risk) + "</td><td>" + esc(c.regime) + "</td></tr>";
      }).join("") + "</tbody></table></div></section>";
    $("open-sample").onclick = function () { detail = { profile: SAMPLE, from: "demo" }; renderAdvMain(); top(); };
    $("demo-xlsx").onclick = function () {
      var btn = this; btn.disabled = true;
      Promise.resolve().then(function () { var f = Exports.clientBookXlsx(MOCK); return Exports.saveFile(f.filename, f.blob); })
        .then(function (r) { $("demo-status").textContent = r.msg; }, function (e) { $("demo-status").textContent = e.message; })
        .finally(function () { btn.disabled = false; });
    };
  }

  render();
})();
</script>
